<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Khôi Phục Mật Khẩu - Máy In Đại Thành Center Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #0f172a; 
            background-image: radial-gradient(at 50% 0%, #1e293b 0%, #0f172a 100%);
            color: #f8fafc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 1rem;
        }

        .login-card { 
            background: #1e293b; 
            padding: 1.75rem 1.25rem; 
            border-radius: 20px; 
            border: 1px solid #334155; 
            width: 100%; 
            max-width: 400px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); 
            text-align: center;
        }

        .brand-logo {
            max-width: 160px;
            height: auto;
            margin-bottom: 1rem;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
        }

        h2 { 
            color: #38bdf8; 
            font-size: 1.25rem; 
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem; 
        }

        p.subtitle { 
            color: #94a3b8; 
            font-size: 0.85rem; 
            margin-bottom: 1.5rem; 
        }

        .form-group { 
            text-align: left;
            margin-bottom: 1rem; 
        }

        label { 
            display: block; 
            font-size: 0.85rem; 
            color: #cbd5e1; 
            margin-bottom: 0.4rem; 
            font-weight: 500;
        }

        input { 
            width: 100%; 
            min-height: 48px; 
            padding: 0.75rem 1rem; 
            border-radius: 10px; 
            border: 1px solid #334155; 
            background: #0f172a; 
            color: #f8fafc; 
            font-size: 1rem; 
            outline: none; 
            transition: border-color 0.2s, box-shadow 0.2s; 
        }

        input:focus { 
            border-color: #0284c7; 
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.25);
        }

        button { 
            width: 100%; 
            min-height: 48px; 
            padding: 0.75rem; 
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-weight: 600; 
            font-size: 1rem; 
            cursor: pointer; 
            margin-top: 0.5rem; 
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        .message-box { 
            background: rgba(59, 130, 246, 0.15); 
            color: #60a5fa; 
            padding: 0.75rem; 
            border-radius: 8px; 
            font-size: 0.85rem; 
            margin-bottom: 1rem; 
            border: 1px solid rgba(59, 130, 246, 0.3); 
            text-align: left;
        }

        .back-link {
            display: block;
            margin-top: 1.25rem;
            font-size: 0.85rem;
            color: #94a3b8;
            text-decoration: none;
        }
        .back-link:hover {
            color: #38bdf8;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <img src="https://ejbillnpxxiubbiyyaxn.supabase.co/storage/v1/object/public/publicLogo/LOGO.png" 
             alt="Máy In Đại Thành" 
             class="brand-logo">

        <h2>KHÔI PHỤC MẬT KHẨU</h2>
        <p class="subtitle">Nhập email để nhận hướng dẫn cấp lại mật khẩu</p>

        {% if message %}
            <div class="message-box">
                ℹ️ {{ message }}
            </div>
        {% endif %}

        <form action="/auth/forgot-password" method="POST">
            <div class="form-group">
                <label for="email">Email đăng ký của bạn</label>
                <input type="email" 
                       id="email" 
                       name="email" 
                       required 
                       placeholder="nhanvien@daithanh.vn"
                       autocomplete="email">
            </div>
            <button type="submit">Gửi yêu cầu khôi phục</button>
        </form>

        <a href="/auth/login" class="back-link">← Quay lại trang Đăng nhập</a>
    </div>
</body>
</html>
