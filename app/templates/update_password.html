<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Đổi Mật Khẩu Mới - Máy In Đại Thành Center Hub</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #0f172a; 
            background-image: radial-gradient(at 50% 0%, #1e293b 0%, #0f172a 100%);
            color: #f8fafc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            padding: 1rem;
        }

        .login-card { 
            background: #1e293b; 
            padding: 1.75rem 1.25rem; 
            border-radius: 20px; 
            border: 1px solid #334155; 
            width: 100%; 
            max-width: 400px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); 
            text-align: center;
        }

        .brand-logo {
            max-width: 160px;
            height: auto;
            margin-bottom: 1rem;
            object-fit: contain;
            filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
        }

        h2 { 
            color: #38bdf8; 
            font-size: 1.25rem; 
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem; 
        }

        p.subtitle { 
            color: #94a3b8; 
            font-size: 0.85rem; 
            margin-bottom: 1.5rem; 
        }

        .form-group { 
            text-align: left;
            margin-bottom: 1rem; 
        }

        label { 
            display: block; 
            font-size: 0.85rem; 
            color: #cbd5e1; 
            margin-bottom: 0.4rem; 
            font-weight: 500;
        }

        input { 
            width: 100%; 
            min-height: 48px; 
            padding: 0.75rem 1rem; 
            border-radius: 10px; 
            border: 1px solid #334155; 
            background: #0f172a; 
            color: #f8fafc; 
            font-size: 1rem; 
            outline: none; 
            transition: border-color 0.2s, box-shadow 0.2s; 
        }

        input:focus { 
            border-color: #0284c7; 
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.25);
        }

        button { 
            width: 100%; 
            min-height: 48px; 
            padding: 0.75rem; 
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-weight: 600; 
            font-size: 1rem; 
            cursor: pointer; 
            margin-top: 0.5rem; 
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message-box { 
            background: rgba(59, 130, 246, 0.15); 
            color: #60a5fa; 
            padding: 0.75rem; 
            border-radius: 8px; 
            font-size: 0.85rem; 
            margin-bottom: 1rem; 
            border: 1px solid rgba(59, 130, 246, 0.3); 
            text-align: left;
        }

        .error-box {
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            padding: 0.75rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            border: 1px solid rgba(239, 68, 68, 0.3);
            text-align: left;
        }

        .back-link {
            display: block;
            margin-top: 1.25rem;
            font-size: 0.85rem;
            color: #94a3b8;
            text-decoration: none;
        }
        .back-link:hover {
            color: #38bdf8;
        }
    </style>

    <!-- Thêm Supabase JS SDK để xử lý token khôi phục ở client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <div class="login-card">
        <img src="https://ejbillnpxxiubbiyyaxn.supabase.co/storage/v1/object/public/publicLogo/LOGO.png" 
             alt="Máy In Đại Thành" 
             class="brand-logo">

        <h2>ĐỔI MẬT KHẨU MỚI</h2>
        <p class="subtitle">Vui lòng nhập mật khẩu mới cho tài khoản của bạn</p>

        <div id="alert-container"></div>

        <form id="update-password-form">
            <div class="form-group">
                <label for="new_password">Mật khẩu mới</label>
                <input type="password" 
                       id="new_password" 
                       required 
                       placeholder="Ít nhất 6 ký tự"
                       minlength="6">
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Xác nhận mật khẩu mới</label>
                <input type="password" 
                       id="confirm_password" 
                       required 
                       placeholder="Nhập lại mật khẩu mới"
                       minlength="6">
            </div>

            <button type="submit" id="submit-btn">Cập Nhật Mật Khẩu</button>
        </form>

        <a href="/auth/login" class="back-link">← Quay lại trang Đăng nhập</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = "https://ejbillnpxxiubbiyyaxn.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVqYmlsbG5weHhpdWJiaXl5YXhuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjkwNzUyMjEsImV4cCI6MjA4NDY1MTIyMX0.2fYkGXmO8SF5xchTMmSGyHZwIlfQ8WoOLaLltOFcXIw"; // Thay bằng Anon Key của bạn
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const alertContainer = document.getElementById('alert-container');
        const form = document.getElementById('update-password-form');
        const submitBtn = document.getElementById('submit-btn');

        function showAlert(message, isError = false) {
            alertContainer.innerHTML = `<div class="${isError ? 'error-box' : 'message-box'}">${isError ? '⚠️' : 'ℹ️'} ${message}</div>`;
        }

        document.addEventListener('DOMContentLoaded', async function() {
            // Kiểm tra xem URL có chứa mã token khôi phục dạng query params (?token=...&type=recovery) không
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const type = urlParams.get('type');

            if (token && type === 'recovery') {
                // Xác thực token trực tiếp với Supabase để tạo phiên làm việc (session)
                const { data, error } = await supabaseClient.auth.verifyOtp({
                    token_hash: token,
                    type: 'recovery'
                });

                if (error) {
                    showAlert("Mã khôi phục không hợp lệ hoặc đã hết hạn.", true);
                    if(form) form.style.display = 'none';
                } else {
                    showAlert("Xác thực thành công. Vui lòng nhập mật khẩu mới.");
                }
            } else {
                // Kiểm tra theo cách thông thường nếu token nằm ở phần hash
                const { data, error } = await supabaseClient.auth.getSession();
                if (error || !data.session) {
                    showAlert("Auth session missing! Vui lòng bấm lại đường dẫn từ email.", true);
                    if(form) form.style.display = 'none';
                }
            }
        });

        // Xử lý sự kiện đổi mật khẩu
        if (form) {
            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const newPassword = document.getElementById('new_password').value;
                const confirmPassword = document.getElementById('confirm_password').value;

                if (newPassword !== confirmPassword) {
                    showAlert("Mật khẩu xác nhận không khớp!", true);
                    return;
                }

                submitBtn.disabled = true;
                submitBtn.textContent = "Đang xử lý...";

                try {
                    const { error } = await supabaseClient.auth.updateUser({
                        password: newPassword
                    });

                    if (error) throw error;

                    showAlert("Cập nhật mật khẩu thành công! Đang chuyển hướng về trang đăng nhập...");
                    form.reset();
                    
                    setTimeout(() => {
                        window.location.href = "/auth/login";
                    }, 2000);

                } catch (err) {
                    showAlert(err.message || "Đã xảy ra lỗi khi đổi mật khẩu.", true);
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Cập Nhật Mật Khẩu";
                }
            });
        }
    </script>
</body>
</html>
